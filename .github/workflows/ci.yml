name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # The integration suite runs against this. Without a real Postgres the
    # harness only protects the machine it was written on, and the bugs it
    # exists for are exactly the ones a mock cannot see.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcapp
          POSTGRES_PASSWORD: fcapp
          POSTGRES_DB: fcapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check generated route tree is up to date
        run: git diff --exit-code -- apps/frontend/src/route-tree.gen.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Integration test
        run: npm run test:integration --workspace @fc-app/backend
        env:
          TEST_DATABASE_URL: postgres://fcapp:fcapp@localhost:5432/fcapp_test
