name: fc-app

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port is configurable so fc-app can run alongside other projects
      # (e.g. project-enigma on 5432); inside the network it is always 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fc-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot service: runs the Kysely migrator (apps/backend/src/db/migrate.ts)
  # against the db container, then exits. The backend waits for it to complete.
  # The in-network DATABASE_URL is built here from POSTGRES_* — the .env
  # DATABASE_URL is reserved for tools running on the host (localhost:5433).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: ["npx", "tsx", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ../apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    networks:
      - fc-app-network
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ../apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    networks:
      - fc-app-network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:${BACKEND_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      VITE_API_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ../apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    networks:
      - fc-app-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  fc-app-network:
    driver: bridge
